name: GitHub-Profile-Summary-Cards

on:
  schedule: # once a day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "master"
          TIME_ZONE: "Europe/Budapest"
          # only the theme the README uses (default: all ~65 themes, ~320 files per commit)
          THEME: "material_palenight"
